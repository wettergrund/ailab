version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: convoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-convoy}
      POSTGRES_USER: ${POSTGRES_USER:-convoy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convoy}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-convoy} -d ${POSTGRES_DB:-convoy}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: convoy-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: convoy-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://convoy:convoy@postgres:5432/convoy}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - convoy

  ai-engine:
    build:
      context: .
      dockerfile: apps/ai-engine/Dockerfile
    container_name: convoy-ai-engine
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - convoy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: convoy-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://nginx/api}
      NEXT_PUBLIC_AI_URL: ${NEXT_PUBLIC_AI_URL:-http://nginx/ai}
    depends_on:
      - api
      - ai-engine
    networks:
      - convoy

  nginx:
    image: nginx:1.25-alpine
    container_name: convoy-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
      - ai-engine
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - convoy

volumes:
  postgres_data:
  redis_data:

networks:
  convoy:
    driver: bridge
